name: Push reminders

on:
  schedule:
    # Every 5 minutes (GitHub's minimum). The scheduler is best-effort and can
    # run late or skip runs; scripts/send-push.js has a wide catch-up window.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification now (1 = yes)'
        default: '0' # lets you fire a test run by hand from the Actions tab too, if you ever want to
  push:
    branches: [main]
    paths:
      - 'data/subscription.json'
      - '.github/workflows/push-reminders.yml'
    # Also runs on a push that touches the subscription file, so Claude
    # committing it is itself a test run — no manual click needed.

permissions:
  contents: write

concurrency:
  group: push-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save web-push@3.6.7
      - run: node scripts/send-push.js
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TEST_PUSH: ${{ github.event.inputs.test }}
      - name: Commit updated sent-log / subscription state
        run: |
          git config user.name "discipline-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sent.json data/subscription.json
          git diff --cached --quiet || git commit -m "Update push reminder state [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 3; done
